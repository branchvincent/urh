[project]
name = "urh"
description = "Universal Radio Hacker: investigate wireless protocols like a boss"
readme = "README.md"
authors = [{ name = "Johannes Pohl", email = "Johannes.Pohl90@gmail.com" }]
requires-python = ">=3.9"
# dependencies = ["cython<3.1", "numpy>=2.0,<3.0", "psutil", "setuptools"]
license = { text = "GNU General Public License (GPL)" }
dynamic = ["dependencies", "version"]

[project.scripts]
urh = "urh.main:main"
urh_cli = "urh.cli.urh_cli:main"

[project.urls]
Homepage = "https://github.com/jopohl/urh"
Downloads = "https://github.com/jopohl/urh/releases"

[tool.setuptools.dynamic]
version = { attr = "urh.version.VERSION" }

# [tool.setuptools.packages.find]
# where = ["src"]
# include = ["urh*"]

[build-system]
requires = ["setuptools>=61", "cython<3.1", "numpy>=2.0,<3.0"]
build-backend = "setuptools.build_meta:__legacy__"
